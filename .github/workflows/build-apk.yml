name: Build Jarvis APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK (release, debug-signed)
        run: |
          flutter build apk \
            --release \
            --build-name="1.1.0-kesob" \
            --build-number=3

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
             artifacts/Jarvis-Uncensored-v1.1.0-KESOB.apk
          ls -lh artifacts/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Uncensored-APK
          path: artifacts/Jarvis-Uncensored-v1.1.0-KESOB.apk
          retention-days: 30

